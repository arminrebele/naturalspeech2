# Canonical production training defaults. Per-mode files (overfit_test,
# loss_analysis, gradient_analysis) inherit and override only their deltas.
# To run the canonical full-scale training: `python scripts/train.py`.

device: "cuda"
init_from: "scratch"     # 'scratch' or 'resume'
gradient_accumulation_steps: 1

max_iters: 300000
warmup_iters: 32000
lr_decay_iters: 300000

# Mode flags — branch training mechanics, not the eval/log/save surface
overfit_single_batch: False
loss_analysis_run: False
gradient_analysis_run: False

# Frequencies (orthogonal)
log_interval: 100
eval_interval: 5000
checkpoint_interval: 5000    # crash-recovery ckpt.pt every 5000 iters

# Eval block contents
eval_iters: 200
audio_tables: [random_dev, fixed_dev_refs]
inference_data_loss_sweep: []   # empty by default; overfit_test enables for solver diagnostics

# Save policy
best_safetensors: True
final_safetensors: True

# Log file location (under PROJECT_ROOT)
log_subdir: "models/checkpoints"
log_name: "main_training"
