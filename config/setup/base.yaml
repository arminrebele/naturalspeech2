# Canonical production training defaults. Per-mode files inherit + override only deltas.
# Full-scale training: `python scripts/train.py`.

device: "cuda"
# 'scratch' = fresh run: new wandb run + fresh logs/<group>/<run_name>/ + models/checkpoints/<group>/
# <run_name>/. If that <run_name> already exists (either tree), the name auto-bumps to <name>-2, -3, …
# so a scratch run NEVER overwrites or appends to a prior one (delete stale folders by hand).
# 'resume' = continue the named run in place: reattach its checkpoint's wandb run (resume="allow") and
# APPEND to its existing folder. The run must already exist on disk. Caveat: resume="allow" is the only
# non-private wandb resume available to us — it DROPS re-logged steps ≤ wandb's last step (the small
# post-checkpoint overlap), since truncating that tail needs the private 'rewind' API. wandb keeps the
# old overlap; the local log continues from the resume point. There is intentionally no overwrite knob.
# For a CLEAN continuation (fresh wandb run + fresh folder, no append/overlap), keep init_from=resume but
# set the top-level `resume_from` to the source run and give `run_name` a new name (see config.yaml).
init_from: "scratch"     # 'scratch' or 'resume'
gradient_accumulation_steps: 1

# torch.compile — applies to the training model (and, via dynamic/mode, the daemon eval forward).
# Defaults reproduce a bare torch.compile(model). dynamic: null=auto (one static graph for a bucket's
# first shape, then one symbolic graph generalizing the rest) / false=static graph per bucket (more
# graphs, no symbolic-shape overhead) / true=fully symbolic. mode: default | reduce-overhead |
# max-autotune-no-cudagraphs | max-autotune (the last two autotune kernels; reduce-overhead + both
# cudagraph modes RAISE peak VRAM → re-run find_max_batch_sizes if adopted). A/B with
# scripts/benchmarks/dataloader/benchmark_compile_modes.py before flipping a real run.
compile:
  enabled: true
  dynamic: null
  mode: default

# max_iters = planned/expected run length (paper 300k × batch ratio 96/80 ≈ 360k). The LR-schedule
# reference (warmup + cosine decay horizon) AND the early-stop floor (never stop before it). Diagnostic
# modes override it and run to exactly this many steps (early_stopping.enabled stays false below).
max_iters: 360000
warmup_ratio: 0.11                   # warmup as a fraction of max_iters (0.11·360k ≈ 40k; paper 32k × 96/80 ≈ 38k). Canonical knob.
warmup_iters: null                   # absolute override; null → round(warmup_ratio · max_iters), resolved at entry. Resume restores the ckpt's pinned value (immune to max_iters changes).
lr_decay_iters: ${setup.max_iters}   # cosine decay horizon — tracks max_iters; ISR ignores it. Resume restores the ckpt's pinned value.

# Early stopping. enabled=false (default → diagnostic/experiment modes + the canonical no-arg run): loop
# runs exactly max_iters. enabled=true (opt in at launch for the extended run): past max_iters the loop
# free-rides ISR with NO fixed upper bound, ending only once EMA dev loss hasn't improved for
# patience_iters — the same best_step that gates ema_best, persisted to eval_state.json. Stop = clean loop
# break → epilogue writes ema_final + final resume ckpt + drains the daemon (unlike a manual interrupt).
# Floor is max_iters: never stops before the planned length.
early_stopping:
  enabled: false
  patience_iters: 50000

# Mode flags — branch training mechanics, not the eval/log/save surface
overfit_single_batch: False
gradient_analysis_run: False
aligner_trial_run: False

# aligner_trial only (inert otherwise): dump per-eval held-out aligner losses (fwd_sum+bin) for the Optuna driver.
aligner_trial_out: "research/aligner_trial_evals.jsonl"

# gradient_analysis only (inert otherwise): per-term gradient diagnostic window.
#   start_iter — first iter analyzed; window is [start_iter, end_iter). May sit inside the loss-weight
#                warmup (the analyzer reads WEIGHTED grads = the term's true, warmup-scaled per-step impact).
#   end_iter   — null → max_iters; else the window CLOSES here and training continues normally to max_iters
#                (an early-phase grad probe bolted onto an otherwise-full gated run — analysis only [start,end)).
#   interval   — null → reuse log_interval; else OVERRIDES the log cadence INSIDE the window, so analysis
#                fires only on log steps (denser logging in the window). Analyzed-step count logged at start.
grad_analysis_start_iter: 0
grad_analysis_end_iter: null
grad_analysis_interval: null

# Frequencies (orthogonal)
log_interval: 100
eval_interval: 3000          # held-out eval cadence (decoupled on GPU1, off the training path). The real per-eval wall is ~11 min (≈670 s for 120 refs, measured from the daemon log's "done in Ys"; the old "~40 min" estimate was wrong) — and drops further with the bsd=1 + larger-batch eval below — vs ~70 min for 3000 normal-run steps (~47 min/2000, drain-timestamp deltas). So the daemon idles most of the gap = ample GPU1 headroom for future side-tasks. Gradient-analysis runs train slower (grad replays) → they densify to eval_interval_daemon (next line + setup/gradient_analysis.yaml); single-GPU keeps this 3000. Confirm the real wall from the daemon log.
eval_interval_daemon: null   # opt-in denser eval cadence, applied ONLY when the daemon offloads eval to GPU1 (resolved in train.py). null → eval_interval stands (main run: no densification). gradient_analysis sets 2000 — its ~10x-slower grad replays overlap the parallel daemon eval for free; single-GPU / daemon-off keeps eval_interval, since blocking in-process eval buys no free time.
checkpoint_interval: 5000    # crash-recovery ckpt.pt every 5000 iters

# Eval block contents
eval_iters: 200
audio_tables: [fixed_val_refs, random_val]  # fixed_val_refs: held-out dev+test validation (audio + WER/SIM-o over num_audio_refs); random_val: 1 random val (dev+test) clip @ 5s vs 10s prompt + random custom text (generation showcase, 2 rows, no metrics)
num_audio_refs: 120             # total held-out refs drawn from the pooled dev+test val set (also the WER + SIM-o sample size — more refs = steadier mean + tighter p10/median/p90). VRAM-NEUTRAL: pack_by_budget caps each gen batch at gen_frame_budget regardless of count (more refs = more batches, same peak), so the GPU1 peak is unchanged; cost is eval wall (~linear). random_val + overfit_batch fixed at 2; num_table_rows still caps the rendered wandb rows at 2
num_table_rows: 2               # how many of those refs to RENDER in each wandb audio table; WER/metrics still use ALL num_audio_refs. Caps table size so it doesn't balloon as num_audio_refs scales (set ≥ num_audio_refs to show all).
gen_frame_budget: 80000         # eval-block batched generation: length-sorted refs packed up to batch·max_latent_frames ≤ this. VRAM headroom is LARGE: the daemon's own eval-log probe shows ~12 GB resident (models + compiled graphs + cached pre-warm + CUDA context) + only ~3 GB eval transient at the old 40000 → ~15 GB peak on the 24 GB 4090. (The earlier "~25 GB / ~97%, no headroom" reading was a colleague's *separate* GPU1 workload, not the daemon — corrected.) Raised 40000→80000 (~2× gen batch; expected peak ~18 GB, ~6 GB safety). The per-eval "X GB before → Y GB peak" line in the daemon log is the feedback loop — raise further only while Y stays under ~21 GB. Used by fixed-ref + random_val gen (in-process + daemon).
inference_data_loss_sweep: []   # empty by default; overfit_test enables for solver diagnostics
eval_metrics: ["wer", "sim_o"]  # objective metrics on the pooled val refs. WER = HuBERT-CTC (no LM); SIM-o = WavLM-Large-SV speaker cosine (gen vs prompt). On the metric device. Inert for modes with no fixed-ref table.
metric_batch_samples: 3200000   # batched-WER budget: length-sorted gen clips packed up to batch·max_16kHz_samples ≤ this (≈200 s audio/forward). HuBERT @no_grad FP32, a low-base separate eval phase → raised 1.6M→3.2M into the confirmed GPU1 headroom. Per-sample logits sliced to CTC length → ~ per-clip WER. (SIM-o stays per-clip: ECAPA pooling is unmasked.)
metric_device: auto             # WER ASR device. auto → cuda:1 if ≥2 GPUs else CPU (never silently steals the training card); override e.g. cuda:0. Daemon forces its own card.

# Decoupled eval daemon — off-loads the eval block to a persistent process on the 2nd GPU so
# the training step never pauses. Active ONLY on a standard 2-GPU training run; single-GPU and
# all diagnostic modes fall back to today's in-process synchronous eval.
eval_daemon:
  enabled: true
  compile: true                 # torch.compile the daemon's eval forward (uses setup.compile.{dynamic,mode}); set false to debug the daemon in eager mode
  snapshot_dir: null            # null → /dev/shm/ns2_eval/<wandb-run-or-pid>; RAM-backed weight handoff
  num_workers: 4                # dataloader workers for EACH of the daemon's own dev/test/train loaders (independent of dataloader.num_workers so the main run isn't slowed)
  batch_size_divisor: 1         # daemon eval forward: divide each bucket's batch_size by this on the 2nd GPU; grad_accum ×same so the logical batch + total samples match the in-process eval. 1 = full batch. Was 2 (a conservative VRAM halving); now 1 — estimate_loss runs @no_grad (minimal retained activations, far under a training step) and the eval-log probe shows ~9 GB headroom, so full batches fit. Fewer, larger launches → faster on the launch-bound eval.
  poll_interval_s: 2.0          # marker poll cadence when idle

# Save policy
best_safetensors: True
final_safetensors: True

# Log + checkpoint location is derived, not configured: logs/<wandb.group>/<run_name>/ and
# models/checkpoints/<wandb.group>/<run_name>/. Set the run via the top-level `run_name` (config.yaml).
