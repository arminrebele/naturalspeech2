# Canonical production training defaults. Per-mode files inherit + override only deltas.
# Full-scale training: `python scripts/train.py`.

device: "cuda"
init_from: "scratch"     # 'scratch' or 'resume'
gradient_accumulation_steps: 1

max_iters: 300000
warmup_ratio: 0.11                   # warmup length as a fraction of max_iters (0.11·300k ≈ 33k; paper: 32k). Canonical knob.
warmup_iters: null                   # absolute override; null → round(warmup_ratio · max_iters), resolved at train() entry
lr_decay_iters: ${setup.max_iters}   # cosine decay horizon — tracks max_iters; ISR ignores it

# Mode flags — branch training mechanics, not the eval/log/save surface
overfit_single_batch: False
loss_analysis_run: False
gradient_analysis_run: False
dropout_trial_run: False

# dropout_trial only (inert otherwise): eval the converged tail; dump per-eval held-out losses for the orchestrator.
dropout_eval_start_frac: 0.8
dropout_trial_out: "research/dropout_trial_evals.jsonl"

# Frequencies (orthogonal)
log_interval: 100
eval_interval: 5000
checkpoint_interval: 5000    # crash-recovery ckpt.pt every 5000 iters

# Eval block contents
eval_iters: 200
audio_tables: [fixed_val_refs, random_dev]  # fixed_val_refs: held-out dev+test validation (audio + WER/SIM-o over num_audio_refs); random_dev: 1 random dev clip @ 5s vs 10s prompt + random custom text (generation showcase, 2 rows, no metrics)
num_audio_refs: 30              # clips per split for held-out refs; fixed_val_refs pools dev+test → 2× (also the WER + SIM-o sample size — more refs = steadier metrics). random_dev + overfit_batch fixed at 2; num_table_rows still caps the rendered wandb rows at 2
num_table_rows: 2               # how many of those refs to RENDER in each wandb audio table; WER/metrics still use ALL num_audio_refs. Caps table size so it doesn't balloon as num_audio_refs scales (set ≥ num_audio_refs to show all). The dev+test val table interleaves both splits so these rows stay balanced.
gen_frame_budget: 40000         # eval-block batched generation: length-sorted refs packed up to batch·max_latent_frames ≤ this. ~ the bsd-halved training batch (≈80k → ≈40k); eager no_grad on the 2nd GPU keeps VRAM well below a training step, so raise if headroom allows. Used by fixed-ref + random_dev gen (in-process + daemon).
inference_data_loss_sweep: []   # empty by default; overfit_test enables for solver diagnostics
eval_metrics: ["wer", "sim_o"]  # objective metrics on fixed dev/test refs. WER = HuBERT-CTC (no LM); SIM-o = WavLM-Large-SV speaker cosine (gen vs prompt). On the metric device. Inert for modes with no fixed-ref table.
metric_batch_samples: 1600000   # batched-WER budget: length-sorted gen clips packed up to batch·max_16kHz_samples ≤ this (≈100 s audio/forward). Conservative for the 2nd GPU under no_grad FP32 — raise given headroom. Per-sample logits sliced to CTC length → ~ per-clip WER. (SIM-o stays per-clip: ECAPA pooling is unmasked.)
metric_device: auto             # WER ASR device. auto → cuda:1 if ≥2 GPUs else CPU (never silently steals the training card); override e.g. cuda:0. Daemon forces its own card.

# Decoupled eval daemon — off-loads the eval block to a persistent process on the 2nd GPU so
# the training step never pauses. Active ONLY on a standard 2-GPU training run; single-GPU and
# all diagnostic modes fall back to today's in-process synchronous eval.
eval_daemon:
  enabled: true
  compile: true                 # torch.compile the daemon's eval forward (the in-process eval forward was already compiled); set false to debug the daemon in eager mode
  snapshot_dir: null            # null → /dev/shm/ns2_eval/<wandb-run-or-pid>; RAM-backed weight handoff
  num_workers: 4                # dataloader workers for EACH of the daemon's own dev/test/train loaders (independent of dataloader.num_workers so the main run isn't slowed)
  batch_size_divisor: 2         # daemon eval only: divide each bucket's batch_size by this on the 2nd GPU (lower forward VRAM); grad_accum is multiplied by the same factor so the logical batch + total sample count match the in-process eval. 1 = full batch.
  poll_interval_s: 2.0          # marker poll cadence when idle

# Save policy
best_safetensors: True
final_safetensors: True

# Log file location (under PROJECT_ROOT)
log_subdir: "models/checkpoints"
log_name: "main_training"
