defaults:
  - base
  - _self_

# Deltas on setup/base.yaml. A single dropout-screening trial: real train split, ISR inherited
# (mirrors the main run). Decision metric = per-term dev+test held-out loss over the last 20%,
# dumped to setup.dropout_trial_out (orchestrator overrides that path + wandb.group/run_name per trial).

max_iters: 30000                 # warmup_ratio (0.11 → 3300) + ISR inherited from base
lr_decay_iters: ${setup.max_iters}

dropout_trial_run: True

# Eval only the converged tail (setup.dropout_eval_start_frac) at a fine cadence;
# dev+test held-out = decision signal (paired vs baseline).
eval_interval: 50
eval_iters: 200                  # >= dev/test batch counts → full held-out passes

audio_tables: []                 # no audio generation during screening
checkpoint_interval: 0           # no crash-recovery checkpoints for short trials
best_safetensors: False
final_safetensors: False         # screening trials produce no inference artifact

log_subdir: "research"
log_name: "dropout_trial"
