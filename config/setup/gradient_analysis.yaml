# @package _global_

defaults:
  - override /wandb: gradient_analysis

setup:
  device: "cuda"
  seed: 42
  init_from: "scratch"
  save_checkpoint: False
  eval_interval: 10000
  log_interval: 10         # Wandb logs the norms every 10 steps so it's not too spammy
  eval_iters: 0
  max_iters: 10000
  gradient_accumulation_steps: 5
  warmup_iters: 0          
  lr_decay_iters: ${setup.max_iters}
  overfit_single_batch: False
  loss_analysis_run: False
  gradient_analysis_run: True

training:
  lr_schedule: "cosine"

# Use the small dev split for development workflows so we don't preprocess
# the full train split (~8h / ~500GB for MLS). full_run keeps train.
dataset:
  train_split: "dev"
