defaults:
  - base
  - _self_

# Overrides on top of setup/base.yaml — only the deltas live here.

max_iters: 10000
warmup_iters: 1100               # ~11% fractional match to the main run's ISR warmup
lr_decay_iters: ${setup.max_iters}

gradient_analysis_run: True

log_interval: 10                 # wandb logs the norms every 10 steps so it's not too spammy
eval_interval: 10000             # >= max_iters → in-loop eval never fires
checkpoint_interval: 0

eval_iters: 0
audio_tables: []

best_safetensors: False
final_safetensors: False

log_subdir: "research"
log_name: "gradient_analysis"
