defaults:
  - base
  - _self_

# Overrides on top of setup/base.yaml — only the deltas live here. Diagnostic mode: trains normally
# (ISR + warmup_ratio 0.11 ≈ 1100, inherited from base); GradientAnalyzer profiles per-loss-term
# gradient norms + pairwise cosines on the last 20% of steps (window hardcoded in train.py), every
# log_interval. Eval / audio / checkpoints all off — pure gradient geometry.

max_iters: 10000

allow_ckpt_overwrite: True       # diagnostic: freely re-run its own subdir (inert here — saves all off)

gradient_analysis_run: True

log_interval: 10                 # log norms every 10 steps (not too spammy)
eval_interval: 10000             # >= max_iters → in-loop eval never fires
checkpoint_interval: 0

eval_iters: 0
audio_tables: []                 # no audio / held-out-loss eval at all
eval_metrics: []                 # no fixed-ref table → metrics already inert; explicit = no ASR/SV load

best_safetensors: False
final_safetensors: False

log_subdir: "logs/experiments"
log_name: "gradient_analysis"
