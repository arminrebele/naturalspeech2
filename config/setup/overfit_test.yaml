defaults:
  - base
  - _self_

# Overrides on top of setup/base.yaml — only the deltas live here.

max_iters: 2000
warmup_iters: 0                  # explicit absolute override of base's warmup_ratio (no warmup; cosine, since ISR asserts warmup>0)
# lr_decay_iters now inherits base (= ${setup.max_iters})

overfit_single_batch: True

log_interval: 10
eval_interval: 500
checkpoint_interval: 0           # 0 disables periodic ckpt.pt (overfit doesn't need crash recovery)

eval_iters: 0                    # 0 disables estimate_loss in run_eval_block
audio_tables: [overfit_batch]
inference_data_loss_sweep: [150, 300, 600, 1000]

best_safetensors: False          # no dev_loss gating on overfit

log_subdir: "research"
log_name: "overfit_test"
