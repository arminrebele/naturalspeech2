# @package _global_
#
# Overfit-test recipe. The `# @package _global_` directive lets this file write
# under both `setup.*` (the default for files in config/setup/) AND `model.*`
# (to zero out all 18 dropout keys), so a single `setup=overfit_test` CLI arg
# brings the complete recipe instead of 18 trailing `model.<x>_dropout=0` flags.
#
# Why dropout off for overfit_test: dropout creates stochastic ẑ₀ predictions
# that the low-t α̅/(1−α̅)² weighting amplifies into large score-loss spikes
# (~30–60% reduction in spike magnitude when off. Min-SNR(γ=5) bounds the rest. 
# Single-batch memorization also benefits from a deterministic forward pass.
#
# Loss-weight warmups (`loss_warmup_steps.*`) are auto-zeroed at runtime in
# scripts/train.py — no override needed here.

defaults:
  - override /wandb: overfit_test

setup:
  device: "cuda"
  init_from: "scratch"     # 'scratch' or 'resume'
  save_checkpoint: False   # No need to checkpoint a dummy test
  eval_interval: 10000     # By disabling checkpoints, we skip the eval loop anyway
  log_interval: 10
  eval_iters: 0
  max_iters: 2000           # Short run to observe rapid overfitting
  gradient_accumulation_steps: 5
  warmup_iters: 0          # No LR warmup needed for overfit
  lr_decay_iters: ${setup.max_iters}   # Tie cosine decay window to run length so
                                        # bumping max_iters on the CLI doesn't leave
                                        # LR flat at min_lr for the trailing iters.
  overfit_single_batch: True
  loss_analysis_run: False
  gradient_analysis_run: False

training:
  lr_schedule: "cosine"

# Use the small dev split for development workflows so we don't preprocess
# the full train split (~8h / ~500GB for MLS). full_run keeps train.
dataset:
  train_split: "dev"

model:
  phoneme_encoder:
    conv_dropout: 0.0
    attn_weights_dropout: 0.0
    attn_out_dropout: 0.0
  aligner:
    dropout: 0.0
  speech_prompt_encoder:
    conv_dropout: 0.0
    attn_weights_dropout: 0.0
    attn_out_dropout: 0.0
  duration_predictor:
    conv_dropout: 0.0
    attn_weights_dropout: 0.0
    attn_out_dropout: 0.0
  pitch_predictor:
    conv_dropout: 0.0
    attn_weights_dropout: 0.0
    attn_out_dropout: 0.0
  diffusion_model:
    attn_weights_dropout: 0.0
    attn_out_dropout: 0.0
    wavenet_attn_weights_dropout: 0.0
    wavenet_attn_out_dropout: 0.0
    wavenet_gate_dropout: 0.0
  # Override base.yaml's halflife_kimg=50 (right for full_run at ~300k iters).
  # On this 2000-iter overfit_test (~14 examples/iter = 27.87 kimg total), 50 leaves
  # the rampup unfinished at end-of-run and the EMA shadow stays contaminated by
  # rampup-region weights. halflife=5 puts rampup-end at iter ~360 and concentrates
  # 90% of the shadow's mass on iter 814-1990 (post-rampup, more-converged weights).
  ema:
    halflife_kimg: 5.0
  # Activate bin_loss at iter 400 (absolute, NOT a fraction of total iters).
  # On the 5-batch overfit task, AlignerNet has moved past prior-dominated
  # scores by then — before that point, bin_loss commits to Viterbi paths
  # decoded from the beta-binomial prior's diagonal peak rather than from
  # learned phoneme-frame features, wasting gradient pulling soft attention
  # toward the prior peak while forward_sum_loss tries to move it elsewhere.
  # Same value applies for any total iter count >400: staging timing is a
  # property of AlignerNet's training trajectory (LR × updates seen), not of
  # run length.
  loss_start_iters:
    aligner_loss:
      bin_loss: 400
