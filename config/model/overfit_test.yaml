defaults:
  - base
  - _self_

# Dropout stays base's all-zero (train.py asserts it for this mode — memorization needs a
# deterministic forward).

# Disable the soft-alignment warmstart: the 6k window would span the entire 2k run (pure-soft
# throughout) and never exercise the hard single-batch memorization gate.
soft_align_steps: 0

# Base's full-run halflife leaves EMA rampup unfinished inside 2000 iters (~14 examples/iter
# ≈ 27.9 kimg total) → shadow stays contaminated by rampup-region weights. 5 ends rampup at
# iter ~360, concentrating ~90% of the shadow's mass on iter 814–1990.
ema:
  halflife_kimg: 5.0

# Loss-weight warmups + holds zeroed: they'd complicate verifying each term converges to ~0 on one batch.
loss_warmup_steps:
  duration_predictor_loss: 0
  pitch_predictor_loss: 0
  aligner_loss:
    group_warmup: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_warmup: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
loss_warmup_hold_steps:
  duration_predictor_loss: 0
  pitch_predictor_loss: 0
  aligner_loss:
    group_hold: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_hold: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
