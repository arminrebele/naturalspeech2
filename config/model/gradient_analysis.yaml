defaults:
  - base
  - _self_

# Keeps base loss_weights (per-term grad L2 norms must reflect the REAL weighted training gradients).
# Zeros warmups AND holds so every term is at full weight from step 0 — a held/ramping term would
# backprop a scaled-down (or zero) gradient, corrupting the imbalance readout the analysis exists to measure.
loss_warmup_steps:
  duration_predictor_loss: 0
  pitch_predictor_loss: 0
  aligner_loss:
    group_warmup: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_warmup: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
loss_warmup_hold_steps:
  duration_predictor_loss: 0
  pitch_predictor_loss: 0
  aligner_loss:
    group_hold: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_hold: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
