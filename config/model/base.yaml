# global model parameters
hidden_dim: 512
latent_dim: 128
rope_base: 10000.0
rope_max_seq_len: 3000
prompt_seconds: 3.0        # fixed prompt length at training; random start position within the clip
min_target_seconds: 1.0    # safety net — minimum target duration preserved on short clips

# Pitch-condition normalization stats (log-F0 mean/std over voiced frames): the pitch projection
# consumes [voiced_flag, (logF0-μ)/σ] so the pitch term is unit-scale (raw Hz would dominate the
# content ~150×). Generated by scripts/compute_pitch_stats.py; recompute if the training corpus changes.
pitch_stats_path: "models/pitch_logf0_stats.pt"

# Stop-gradient on the phoneme-encoder → aligner / duration-predictor edges (parallel-TTS decoupling).
# duration: Glow-TTS Eq 6 sg[·]. aligner: matches RAD-TTS's structural shielding (their aligner reads
# the pre-encoder embedding, so alignment grads never reach the contextual encoder; ours reads the
# post-encoder output, so we detach instead). Pitch stays attached (RAD-TTS F0 reads non-detached
# text_enc). false → the coupled form.
detach_aligner_input: true
detach_duration_predictor_input: true

# Soft-alignment conditioning warmstart: for the first soft_align_steps the diffusion model is conditioned
# on the aligner's SOFT alignment (A_soft @ phoneme_encodings, differentiable), then switches to the hard
# durations path.
soft_align_steps: 6000          # pure soft conditioning for the first N steps (0 = disabled)
soft_align_ramp_steps: 0        # 0 = sharp soft→hard switch (RAD-TTS); >0 = linear α 1→0 ramp after the hold
detach_soft_alignment: false    # attach the soft alignment to the diffusion gradient during the warmstart

# Encodec (frozen audio codec)
encodec:
  # kbps → RVQ books summed into z₀ (0.75/book): 1.5→2 · 3→4 · 6→8 · 12→16 · 24→32.
  # 12 ≈ the paper's 12.8 kbps target rate. Pre-2026-06-11 ckpts trained at 24 →
  # resume/probe them with bandwidth 24 + the _bw24 stats.
  bandwidth: 12
  # Per-channel μ/σ of the z₀ sum (VP-SDE wants unit variance; inverted before decode).
  # Must match the bandwidth (_bw12/_bw24; unsuffixed = legacy bw-24 name kept for old
  # ckpt configs). null → identity. Generated by scripts/compute_encodec_latent_stats.py.
  latent_stats_path: "models/encodec_24khz/encodec_latent_stats_bw12.pt"

# Log Mel Spectrogram Generator
mel:
  n_fft: 1024
  n_mels: 80
  f_min: 0.0
  f_max: null
  # Optional per-channel μ/σ (len n_mels) standardizing the dB log-mel fed to the aligner; generated by
  # scripts/compute_mel_stats.py. null → identity (raw dB-mel into the aligner, no standardization).
  stats_path: null

# Dropout default 0 everywhere (underfitting regime → regularization net-negative; diffusion denoisers
# run dry — DDPM/ADM/DiT/LDM default 0). Reintroduce locally only on an observed overfitting signal
# (dev/train divergence); the small predictors are the likeliest place.
phoneme_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Aligner — raw squared-L2 attention (One-TTS-Alignment paper / RAD-TTS): learned_scores = −‖mel−text‖²
# on un-normalized features (Glow-TTS Gaussian grounding). Sharpness = feature magnitude via the aligner's
# Xavier init — our substitute for the fixed temp=0.0005 the radtts code applies (the paper omits it; we
# follow the paper). See aligner.py.
aligner:
  attn_channels: 80     # distance dim: both encoders project to 80 (mel native; text 512→1024→80)
  prior_w: 1.0          # Beta-Binomial prior strength ω (One-TTS Eq 12-13; RAD-TTS shipped 1.0; higher = narrower/more-peaked prior). LJS-validated only — untested on multi-speaker MLS. Optuna-tunable [0.01,1.0]
  blank_logit: -1.0     # ForwardSumLoss blank, in log_softmax+prior space (metric-scale-invariant)
  dropout: 0.0

# Speech Prompt Encoder — same architecture as the phoneme encoder; dropout 0 (see above).
speech_prompt_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Duration Predictor — dropout policy: see top (NS2/FastSpeech2 ran 0.5 on the conv path).
duration_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 3
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Pitch Predictor — dropout policy: see top.
pitch_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 5
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Diffusion Model — dropout policy: see top.
diffusion_model:
  wavenet_layers: 40
  wavenet_kernel_size: 3
  wavenet_dilation: 2
  wavenet_filter_size: 1024
  attention_heads: 8
  query_tokens: 32
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0
  wavenet_attn_weights_dropout: 0.0
  wavenet_attn_out_dropout: 0.0
  wavenet_gate_dropout: 0.0
  time_dim: 128
  # Multiplies t before the sinusoid frequency ladder. At 1.0 the fastest channel spans ~1 rad
  # over t∈[0,1] (near-degenerate); 1000 maps t onto the ladder's designed 0..1000 positional
  # range (Grad-TTS pe_scale convention).
  timestep_embedding_scale: 1.0
  beta_min: 0.1
  beta_max: 20.0
  # Noise schedule. "cosine" (Nichol-Dhariwal 2021) keeps ᾱ high longer than the legacy linear-β
  # VP-SDE (ᾱ(0.5): 0.49 vs 0.08), so logit-normal t-sampling lands on the ~0 dB content band.
  schedule: "cosine"
  cosine_s: 0.008
  sampling_steps: 150
  sampling_temperature: 1.44     # τ = 1.2² — initial noise ~ N(0, τ⁻¹·I)
  timestep_eps: 0.001
  min_snr_gamma: 5.0
  # Training-time t distribution: "uniform" | "logit_normal" (paper-silent; logit-normal per SD3,
  # Esser et al. ICML 2024). mean=1.0 shifts the median t 0.5→0.73 onto the high-t band. Eval always
  # draws uniform → held-out losses stay comparable across schemes.
  t_sampling: "logit_normal"
  t_logit_mean: 1.0
  t_logit_std: 1.0

# EMA of model weights for sampling. halflife_kimg = halflife in thousands of training examples
# (Karras EDM Appendix B.4); rampup at cur_kimg < halflife_kimg keeps the early shadow off the random init.
# Effective smoothing is relative to run length (σ_rel ∝ halflife_kimg / max_iters): 100 is calibrated
# for 80k-step runs — re-derive before the 400k run (same value smooths 5× less there).
ema:
  enabled: true
  halflife_kimg: 100.0

# Loss Balancing Weights — paper states only ce_rvq = 0.1; all other terms summed as-is
# (aligner/voicing are our paper-silent additions). Deviate only on measured pathology (conflict or
# starvation): warmup first, then static down-weight. The no-pathology verdict is a snapshot of the
# then-current arch/hparams — re-run gradient + loss analysis after any magnitude-shifting change.
loss_weights:
  duration_predictor_loss: 1.0
  pitch_predictor_loss: 1.0
  pitch_voicing_loss: 1.0
  aligner_loss:
    group_weight: 1.0
    forward_sum_loss: 1.0
    bin_loss: 0.1
  diffusion_loss:
    group_weight: 1.0
    data_loss: 1.0
    score_loss: 1.0
    ce_rvq_loss: 0.1

# Loss-weight schedule: hold at weight 0 for loss_warmup_hold_steps, then linear ramp 0→target over
# loss_warmup_steps. Full weight at hold + ramp; both 0 = full from step 0. Absolute steps, not a fraction
# of max_iters.
#   conditioning : soft [0,6k), then hard durations
#   forward_sum  : full from 0
#   bin          : hold 18k, → full 24k
#   duration     : hold 24k, → full 30k
#   pitch/voicing: full from 0
#   diffusion    : full from 0
loss_warmup_steps:                # ramp length AFTER the hold (full weight at hold + this)
  duration_predictor_loss: 6000
  pitch_predictor_loss: 0
  pitch_voicing_loss: 0
  aligner_loss:
    group_warmup: 0
    forward_sum_loss: 0
    bin_loss: 6000
  diffusion_loss:
    group_warmup: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0

loss_warmup_hold_steps:           # steps held at weight 0 before the ramp begins
  duration_predictor_loss: 24000
  pitch_predictor_loss: 0
  pitch_voicing_loss: 0
  aligner_loss:
    group_hold: 0
    forward_sum_loss: 0
    bin_loss: 18000
  diffusion_loss:
    group_hold: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
