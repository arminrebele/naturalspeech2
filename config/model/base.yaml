# global model parameters
hidden_dim: 512
latent_dim: 128
rope_base: 10000.0
rope_max_seq_len: 3000
prompt_seconds: 3.0        # fixed prompt length at training; random start position within the clip
min_target_seconds: 1.0    # safety net — minimum target duration preserved on short clips

# Stop-gradient on the phoneme-encoder → aligner / duration-predictor edges (parallel-TTS decoupling:
# Glow-TTS sg[·] on the duration input; RAD-TTS standalone aligner). The aligner + duration losses then
# train only their own heads, not the shared phoneme encoder — which keeps learning via the diffusion
# condition path. Motivation: measured bin+duration grad on the encoder ≫ diffusion grad (~30–300×),
# and bin's gradient is unstable (Viterbi churn). Set false to A/B the coupled (paper-divergent) form.
detach_aligner_input: true
detach_duration_predictor_input: true

# Encodec (frozen audio codec)
encodec:
  # kbps → RVQ books summed into z₀ (0.75/book): 1.5→2 · 3→4 · 6→8 · 12→16 · 24→32.
  # 12 ≈ the paper's 12.8 kbps target rate. Pre-2026-06-11 ckpts trained at 24 →
  # resume/probe them with bandwidth 24 + the _bw24 stats.
  bandwidth: 12
  # Per-channel μ/σ of the z₀ sum (VP-SDE wants unit variance; inverted before decode).
  # Must match the bandwidth (_bw12/_bw24; unsuffixed = legacy bw-24 name kept for old
  # ckpt configs). null → identity. Generated by scripts/compute_encodec_latent_stats.py.
  latent_stats_path: "models/encodec_24khz/encodec_latent_stats_bw12.pt"

# Log Mel Spectrogram Generator
mel:
  n_fft: 1024
  n_mels: 80
  f_min: 0.0
  f_max: null

# Dropout default 0 everywhere (underfitting regime → regularization expected net-negative).
# Reintroduce locally only if a run shows overfitting (dev/train divergence); the small predictors
# are the likeliest place. Set by intuition + literature, not tuned by a pipeline.
phoneme_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Aligner — raw squared-L2 attention (paper: One-TTS-Alignment / RAD-TTS), no temperature.
# learned_scores = −‖mel−text‖² on un-normalized features (Glow-TTS Gaussian grounding). Sharpness
# is set by feature magnitude via the aligner's Xavier init, not a scalar knob. See aligner.py.
aligner:
  attn_channels: 80     # distance dim: both encoders project to 80 (mel native; text 512→1024→80)
  prior_w: 0.05         # Beta-Binomial prior strength ω (paper Eq 12-13; RAD-TTS scaling_factor=0.05)
  blank_logit: -1.0     # ForwardSumLoss blank, in log_softmax+prior space (metric-scale-invariant)
  dropout: 0.0

# Speech Prompt Encoder — same architecture as the phoneme encoder; dropout 0 (see above).
speech_prompt_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Duration Predictor. Dropout 0 (see PhonemeEncoder). FastSpeech2/NS2 ran 0.5 on the conv path;
# under the underfitting prior we start at 0 — predictors are the first place to reintroduce if
# overfitting shows (they can overfit scalar targets while the diffusion model still underfits).
duration_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 3
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Pitch Predictor — same dropout policy as the duration predictor (0 default; likeliest place to
# reintroduce if overfitting).
pitch_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 5
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.0
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0

# Diffusion Model. Dropout 0 (see PhonemeEncoder) — diffusion denoisers run dry (DDPM/ADM/DiT/LDM
# default 0; the paper reports still-underfitting). Reintroduce dropout only on an observed
# overfitting signal (CLI field overrides or a dedicated named model override), not by default.
diffusion_model:
  wavenet_layers: 40
  wavenet_kernel_size: 3
  wavenet_dilation: 2
  wavenet_filter_size: 1024
  attention_heads: 8
  query_tokens: 32
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0
  wavenet_attn_weights_dropout: 0.0
  wavenet_attn_out_dropout: 0.0
  wavenet_gate_dropout: 0.0
  time_dim: 128
  beta_min: 0.1
  beta_max: 20.0
  sampling_steps: 150
  sampling_temperature: 1.44     # τ = 1.2² — initial noise ~ N(0, τ⁻¹·I)
  timestep_eps: 0.001
  min_snr_gamma: 5.0
  # Training-time t distribution: "uniform" | "logit_normal" (paper is silent on t-sampling;
  # logit-normal per SD3, Esser et al. ICML 2024, concentrates draws in the mid-noise band).
  # Eval always draws uniform regardless → held-out losses stay comparable across schemes.
  t_sampling: "logit_normal"
  t_logit_mean: 0.0
  t_logit_std: 1.0

# EMA of model weights for sampling. halflife_kimg = halflife in thousands of training examples
# (Karras EDM Appendix B.4); rampup at cur_kimg < halflife_kimg keeps the early shadow off the random init.
ema:
  enabled: true
  halflife_kimg: 50.0

# Loss Balancing Weights — paper states only ce_rvq = 0.1, no other weight (terms summed as-is;
# aligner/voicing are our paper-silent additions). Kept: gradient analysis shows aligned diffusion
# trio (cos 0.7–0.95), near-orthogonal rest → no conflicts; magnitude ≠ impact (near-equal-magnitude
# terms differ ~30× in shared-param grad norm) → no magnitude equalization. Accepted asymmetries:
# bin+duration dominate the phoneme encoder (grad ~8 vs ≤0.15 from diffusion terms); fs↔bin
# cos ≈ −0.6 = structural CTC-spread↔sharpening tug (Optuna/overfit-validated). Deviate only on
# measured pathology (conflict or starvation): warmup first, then static down-weight. Measurements
# are snapshots of the then-current arch/hparams, not constants — re-run both analyses after any
# magnitude-shifting change before trusting the no-pathology verdict again.
loss_weights:
  duration_predictor_loss: 1.0
  pitch_predictor_loss: 1.0
  pitch_voicing_loss: 1.0
  aligner_loss:
    group_weight: 1.0
    forward_sum_loss: 1.0
    bin_loss: 1.0
  diffusion_loss:
    group_weight: 1.0
    data_loss: 1.0
    score_loss: 1.0
    ce_rvq_loss: 0.1

# Loss Balance Targets — what-if DIAGNOSTIC only, not the adopted policy (weights above follow the
# paper + gradient analysis; don't paste the suggestion in blindly). Read ONLY by the loss-analysis
# run (+experiment=loss_analysis), which prints the loss_weights that would equalize contribution
# shares from these + measured raw magnitudes; never read during training. Flat leaves and each
# group's group_target share one top-level scale; sub-targets split within the group. Suggestion
# anchored so data_loss=1.0 (preserves the diffusion gradient scale → paper LR transfers).
loss_balance_targets:
  duration_predictor_loss: 1.0
  pitch_predictor_loss: 1.0
  pitch_voicing_loss: 1.0
  aligner_loss:
    group_target: 1.0
    forward_sum_loss: 1.0
    bin_loss: 1.0
  diffusion_loss:
    group_target: 1.0
    data_loss: 1.0
    score_loss: 1.0
    ce_rvq_loss: 0.1

# Warmup ramps a loss weight 0.1×→1.0× over N steps (0 = full from step 0). Paper uses none; we keep
# one. duration_predictor_loss warms over 1000 steps — its target is the aligner's Viterbi durations,
# which move fastest during the aligner's steep early descent; the ramp avoids chasing a shifting
# target. pitch/pitch_voicing target stable GT → no warmup. Aligner full from step 0 (everything
# downstream depends on it). Diffusion loss is the primary objective and is NOT warmed (warming would
# down-weight conditioning-independent denoising too; neither paper nor diffusion literature warms it).
loss_warmup_steps:
  duration_predictor_loss: 1000
  pitch_predictor_loss: 0
  pitch_voicing_loss: 0
  aligner_loss:
    group_warmup: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_warmup: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
