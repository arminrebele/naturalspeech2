# global model parameters
hidden_dim: 512
latent_dim: 128
rope_base: 10000.0
rope_max_seq_len: 3000
prompt_seconds: 3.0        # fixed prompt length at training; random start position within the clip
min_target_seconds: 1.0    # safety net — minimum target duration preserved on short clips

# Encodec (frozen audio codec)
encodec:
  # Per-channel latent norm stats (mean, std, len 128). Generated once by
  # scripts/compute_encodec_latent_stats.py on a training subset. Encodec's quantizer.decode
  # output has per-scalar var ≈ 22 with ~6.8× per-channel std heterogeneity; the VP-SDE schedule
  # assumes unit-variance signals → standardize per-channel before training, invert before the
  # codec decoder. null to disable (identity — buffers stay mean=0, std=1).
  latent_stats_path: "models/encodec_24khz/encodec_latent_stats.pt"

# Log Mel Spectrogram Generator
mel:
  n_fft: 1024
  n_mels: 80
  f_min: 0.0
  f_max: null

# Phoneme Encoder
# Dropout: §4.2 says 0.1 here (Table 11's 0.2 conflicts; 0.1 matches FastSpeech2).
# attn_weights_dropout is on the softmax map (SDPA dropout_p) — unsourced (Vaswani's 0.1 was
# on sub-layer outputs, not the map) → 0.0.
phoneme_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.1
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.1

# Aligner
# temperature = cosine-attention scale: features are L2-normalized, so dist ∈ [0,4] and the
# per-frame softmax logit is 2·temperature·cos → effective cosine scale 2·temperature. At
# effective ~10 (temp 5) the softmax can't sharpen on multi-speaker data (p=0.5 needs a ~0.5
# cosine gap vs every competitor) → bin_loss floors near ln2. temp 12 (effective 24) reaches
# p≈0.9 at a realistic ~0.15–0.25 cosine gap (sharpening regime), below CLIP's learned ~14–20.
# The old 0.0005 was an NVIDIA constant for un-normalized features; under N(0,0.02) init it
# collapsed the softmax to ~uniform. See aligner.py AlignerNet.forward.
aligner:
  attn_channels: 80
  temperature: 12.0
  prior_w: 1.0
  dropout: 0.1

# Speech Prompt Encoder — same architecture and dropout rationale as the phoneme encoder.
speech_prompt_encoder:
  transformer_layers: 6
  attention_heads: 8
  conv1d_filter_size: 2048
  conv1d_kernel_size: 9
  conv_dropout: 0.1
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.1

# Duration Predictor
# conv_dropout 0.5 = paper (§4.2 / Table 11), tracing to FastSpeech2's conv-path variance-predictor
# dropout. The prompt cross-attention is NS2's own, unspecified by the paper: attn_weights_dropout
# on the softmax map is unsourced → 0.0; attn_out keeps Vaswani's 0.1. Don't "restore" attn dropouts to 0.5.
duration_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 3
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.5
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.1

# Pitch Predictor — same dropout rationale as the duration predictor above
# (conv-path 0.5 paper-faithful; NS2-added cross-attention: softmax-map 0.0, output 0.1).
pitch_predictor:
  conv1d_layers: 30
  conv1d_kernel_size: 5
  attention_layers: 10
  attention_heads: 8
  conv_dropout: 0.5
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.1

# Diffusion Model
# Denoiser dropout → 0.0. Diffusion denoisers run dry: DDPM 0.0 off CIFAR-10, ADM/DiT/LDM default
# 0.0, DiffWave (our WaveNet analog) none. The paper's single 0.2 (Table 11) fans into 5 sites ×
# 40 blocks; at 0.2 only 0.8^40 ≈ 1e-4 of a conditioning unit survives → guts the FiLM/attention
# path. Paper also reports "still underfitting" → minimal reg. Small-data probes add a little back
# at safe sites only (see config/model/multibatch.yaml).
diffusion_model:
  wavenet_layers: 40
  wavenet_kernel_size: 3
  wavenet_dilation: 2
  wavenet_filter_size: 1024
  attention_heads: 8
  query_tokens: 32
  attn_weights_dropout: 0.0
  attn_out_dropout: 0.0
  wavenet_attn_weights_dropout: 0.0
  wavenet_attn_out_dropout: 0.0
  wavenet_gate_dropout: 0.0
  time_dim: 128
  beta_min: 0.1
  beta_max: 20.0
  sampling_steps: 150
  sampling_temperature: 1.44     # τ = 1.2² — initial noise ~ N(0, τ⁻¹·I)
  timestep_eps: 0.001
  min_snr_gamma: 5.0

# EMA of model weights for sampling. halflife_kimg = halflife in thousands of training examples
# (Karras EDM Appendix B.4); rampup at cur_kimg < halflife_kimg keeps the early shadow off the random init.
ema:
  enabled: true
  halflife_kimg: 50.0

# Loss Balancing Weights
loss_weights:
  duration_predictor_loss: 1.0
  pitch_predictor_loss: 1.0
  pitch_voicing_loss: 1.0
  aligner_loss:
    group_weight: 1.0
    forward_sum_loss: 1.0
    bin_loss: 1.0
  diffusion_loss:
    group_weight: 1.0
    data_loss: 1.0
    score_loss: 1.0
    ce_rvq_loss: 0.1

# Loss Balance Targets — desired contribution *share* of each leaf. Read ONLY by the loss-analysis
# run (+experiment=loss_analysis), which prints suggested loss_weights from these + measured raw
# magnitudes; never read during training. Flat leaves and each group's group_target share one
# top-level scale; sub-targets split within the group. Suggested weights anchored so data_loss=1.0
# (preserves the diffusion gradient scale → paper LR transfers).
loss_balance_targets:
  duration_predictor_loss: 1.0
  pitch_predictor_loss: 1.0
  pitch_voicing_loss: 1.0
  aligner_loss:
    group_target: 1.0
    forward_sum_loss: 1.0
    bin_loss: 1.0
  diffusion_loss:
    group_target: 1.0
    data_loss: 1.0
    score_loss: 1.0
    ce_rvq_loss: 0.1

# Warmup ramps a loss weight 0.1×→1.0× over N steps (0 = full from step 0). Paper uses none; we keep
# one. duration_predictor_loss warms over 1000 steps — its target is the aligner's Viterbi durations,
# which move fastest during the aligner's steep early descent; the ramp avoids chasing a shifting
# target. pitch/pitch_voicing target stable GT → no warmup. Aligner full from step 0 (everything
# downstream depends on it). Diffusion loss is the primary objective and is NOT warmed (warming would
# down-weight conditioning-independent denoising too; neither paper nor diffusion literature warms it).
loss_warmup_steps:
  duration_predictor_loss: 1000
  pitch_predictor_loss: 0
  pitch_voicing_loss: 0
  aligner_loss:
    group_warmup: 0
    forward_sum_loss: 0
    bin_loss: 0
  diffusion_loss:
    group_warmup: 0
    data_loss: 0
    score_loss: 0
    ce_rvq_loss: 0
