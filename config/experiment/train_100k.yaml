# @package _global_
#
# 100k-clip MLS-train generalization run — python scripts/train.py +experiment=train_100k
#
# A scaled-DOWN real run (NOT the train-on-dev probe): TRAIN split capped to 100k clips via
# max_train_clips (applied BEFORE preprocessing → only 100k pitch-extracted, ~1.5 h not ~5 days).
# Tests data starvation: does more data + far more speakers (100k clips, thousands of speakers vs
# dev's 42) improve the COMBINED dev+test held-out validation? Held-out trajectory is the signal:
#   improving     ⇒ real scaling curve → the full 10.8M run is justified
#   flat / rising ⇒ architecture/optimization ceiling, diagnose deeper.
#
# Scale: ~70 clips/step ⇒ 100k ≈ 1.4k steps/epoch ⇒ 20k iters ≈ ~14 epochs (NOT <1 epoch — that
# holds only for the full 10.8M). A rising held-out curve = 100k being memorized → need more data.
#
# Deltas vs base only; everything else (eval_iters, checkpoint_interval, audio_tables=[fixed_val_refs],
# num_audio_refs, eval_metrics=[wer], sweeps, safetensors, drop_last) is inherited.

defaults:
  - override /model: multibatch    # reduced dropout for the data-limited regime (100k « paper's 44k h); matches the dev runs

dataset:
  max_train_clips: 100000          # cap train to 100k BEFORE preprocessing; train_split stays "train" (base default)

setup:
  max_iters: 20000                 # ISR + warmup_ratio (0.11 → 2200) inherited from base — same schedule type as the full run
  # eval_interval inherits base (5000) → 4 evals across the run; each = combined dev+test held-out (loss + WER + SIM-o + audio)
  log_subdir: "research"
  log_name: "train_100k"

wandb:
  group: "generalization"
  run_name: "train_100k"
