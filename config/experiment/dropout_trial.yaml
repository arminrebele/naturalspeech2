# @package _global_
#
# Hydra experiment pattern: additive overrides for a single dropout-screening trial.
# Launched by the dropout orchestrator (one subprocess per config), or manually:
#   python scripts/train.py +experiment=dropout_trial model.phoneme_encoder.attn_weights_dropout=0.1
#
# Real train split (like loss_analysis — generalization signal must reflect production data).
# Per-term dev+test held-out losses over the last 20% → setup.dropout_trial_out for the
# orchestrator's paired z-test. Dropout rates set per-trial via CLI; everything else inherits
# base, so /model is intentionally not overridden.

defaults:
  - override /setup: dropout_trial
  - override /wandb: dropout_trial
