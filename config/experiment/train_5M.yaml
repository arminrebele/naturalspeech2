# @package _global_
#
# Scaling run on the preprocessed MLS-train shards — python scripts/train.py +experiment=train_5M
#
# Successor to the 100k probe: max_train_clips sized to the preprocessed train store (thousands of
# speakers). The step budget covers well under one epoch, so most clips are seen once => the
# generalization regime, not the 100k run's memorization regime. Gate = COMBINED dev+test held-out
# validation + free-running audio (WER + listen), NOT the teacher-forced inference_data_loss sweep.
#
# Re-measure the phoneme_length caps (dataloader/base.yaml) before growing max_train_clips — they are
# hard pad-width caps that climb with N. Deltas vs base only; everything else is inherited.

run_name: train_5M               # default; override per run (e.g. run_name=train_5M_l1dur). One knob → wandb + logs + checkpoints.

dataset:
  max_train_clips: 5000000

setup:
  max_iters: 40000

wandb:
  group: "generalization"
