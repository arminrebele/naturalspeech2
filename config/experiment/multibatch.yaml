# @package _global_
#
# Multi-batch generalization probe — python scripts/train.py +experiment=multibatch
#
# Trains on the FULL dev split; every eval generates FREE-RUNNING audio on the held-out TEST
# split (fixed_test_refs, never trained on) beside the trained-on dev clips (fixed_dev_refs).
# Held-out clips becoming intelligible = the model learns the phoneme/pitch conditioning rather
# than memorizing — the test the single-batch overfit run couldn't give. Both tables use a
# dedicated seeded RNG → same clips every run for clean cross-run A/B.
#
# Uses model/multibatch (mild dropout for the small-data regime; see that file). grad_accum
# inherits base (= 1).
#
# Tune by watching the held-out audio:
#   setup.max_iters — train longer if held-out still improving; cut if plateaued / overfitting dev.
#   train size      — currently all of dev (~3807 clips); a smaller-subset ladder needs a sampler change.

defaults:
  - override /model: multibatch

training:
  lr_schedule: "cosine"          # short run — ISR's 32k warmup doesn't fit

dataset:
  train_split: "dev"             # train on dev; test is the held-out eval set

setup:
  max_iters: 20000
  warmup_iters: 500              # lr_decay_iters inherits base (= ${setup.max_iters} = 20000 here)
  log_interval: 25               # finer than base's 100 — watch early generalization
  eval_interval: 1000            # each eval generates 4 clips (2 dev + 2 test) — keep modest
  audio_tables: [fixed_dev_refs, fixed_test_refs]   # trained-on + held-out, both stable across runs
  inference_data_loss_sweep: []  # overfit-only / teacher-forced; blind to conditioning, unused here
  # num_audio_refs (10) + eval_metrics (["wer"]) inherited from setup/base; WER lands on both dev (trained-on) and held-out test.
  log_subdir: "research"
  log_name: "multibatch"

wandb:
  group: "generalization"
  run_name: "multibatch_dev"
