# @package _global_
#
# Multi-batch generalization probe — python scripts/train.py +experiment=multibatch
#
# Trains on a SMALL slice of the real `train` split (max_train_clips); every eval generates
# FREE-RUNNING audio on the held-out pooled `val` set (dev+test, fixed_val_refs, never trained on)
# beside the trained-on `train`-slice clips (fixed_train_refs). Held-out clips becoming intelligible
# = the model learns the phoneme/pitch conditioning rather than memorizing — the test the
# single-batch overfit run couldn't give. This is the SAME wiring as the full run (train → val),
# just smaller, so it's a faithful scaled-down replica. Both tables use a dedicated seeded RNG →
# same clips every run for clean cross-run A/B.
#
# Runs on base (zero dropout — the underfitting-regime default); grad_accum inherits base (= 1).
# If the probe shows the model overfitting the train slice, add dropout deliberately, not here.
#
# Tune by watching the held-out audio:
#   setup.max_iters         — train longer if held-out still improving; cut if plateaued / overfitting.
#   dataset.max_train_clips — the train-size ladder (free knob): raise/lower the slice size.

dataset:
  max_train_clips: 4000          # small `train` slice (~56 full batches); the generalization-probe size knob

setup:
  max_iters: 20000               # ISR + warmup_ratio (0.11 → 2200) inherited from base — same schedule type as the full run
  allow_ckpt_overwrite: true     # probe re-run often across the train-size ladder → freely overwrite its own subdir
  log_interval: 25               # finer than base's 100 — watch early generalization
  audio_tables: [fixed_train_refs, fixed_val_refs]   # trained-on (train slice) + held-out (dev+test pooled), both stable across runs
  inference_data_loss_sweep: []  # overfit-only / teacher-forced; blind to conditioning, unused here
  # num_audio_refs (60) + eval_metrics (["wer","sim_o"]) inherited from setup/base; WER/SIM-o land on both train (trained-on) and val (held-out).
  log_subdir: "logs/experiments"
  log_name: "multibatch"

wandb:
  group: "generalization"
  run_name: "multibatch_train"
