# @package _global_
#
# Hydra experiment pattern: additive overrides for a single aligner-scalar tuning trial.
# Launched by the Optuna driver (scripts/tuning/run_aligner_optuna.py — one subprocess per config),
# or manually:
#   python scripts/train.py +experiment=aligner_trial \
#       model.aligner.prior_w=0.1 model.aligner.blank_logit=-2
#
# Real train split (alignment quality must reflect production data, not the tiny dev split). Per-eval
# held-out forward_sum+bin losses → setup.aligner_trial_out for the driver to minimize over the
# converged tail. Scalars set per-trial via CLI; everything else inherits base, so /model is
# intentionally not overridden. Run on the LOCKED aligner architecture (attn_channels, conv stacks).

defaults:
  - override /setup: aligner_trial

run_name: aligner_trial          # default; the Optuna driver overrides per trial (and bumps on re-run)

wandb:
  group: "aligner-trial"
