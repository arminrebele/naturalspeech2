defaults:
  - _self_
  - dataset: mls_eng
  - dataloader: base
  - model: base
  - training: base
  - setup: base
  - wandb: base
  # Per-experiment additive overrides (Hydra canonical experiment pattern):
  #   python scripts/train.py +experiment=overfit_test
  # See config/experiment/*.yaml. No-arg runs use the canonical full-scale
  # training defaults (the base files of every group).

# Process-level reproducibility knob — seeds torch + Python random at train()
# entry. Affects model init, diffusion t/ε sampling, prompt windows, eval-block
# prompt picks, DataLoader worker RNG. cuDNN determinism is NOT enforced.
# Override per-run for seed-sensitivity sweeps: `seed=1234`.
seed: 42
