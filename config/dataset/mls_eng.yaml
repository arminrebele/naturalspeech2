name: "mls_eng"
source: "parler-tts/mls_eng"
train_split: "train"                # HF slice syntax ("train[:50%]") does NOT work here — broken by the data_files parquet-restriction in dataset.py; use max_train_clips below for a row-count subset
dev_split: "dev"
test_split: "test"
text_column: "transcript"
audio_column: "audio"
filter_column: null
filter_substring: null
token_vocabulary_path: null
min_audio_length: 24000             # 1 second of audio at 24kHz
max_audio_length: null
min_phoneme_length: 1
max_phoneme_length: null
max_train_clips: null               # cap the TRAIN split to N clips, applied in DatasetWrapper BEFORE preprocessing (only N clips get pitch-extracted, not the full split). Seeded shuffle (cfg.seed) → reproducible + speaker-diverse. null = full split. Each N caches to its own processed_*_n<N> dir.
