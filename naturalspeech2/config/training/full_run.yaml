# @package _group_
device: "cuda"
init_from: "scratch"     # 'scratch' or 'resume'
eval_interval: 2000
log_interval: 10
eval_iters: 100
max_iters: 600000
learning_rate: 6e-4
min_lr: 6e-5
weight_decay: 1e-1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: True
warmup_iters: 2000
lr_decay_iters: 600000