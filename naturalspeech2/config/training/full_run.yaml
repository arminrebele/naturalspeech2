# @package _group_
device: "cuda"
init_from: "scratch"     # 'scratch' or 'resume'
save_checkpoint: True
eval_interval: 5000
log_interval: 100
eval_iters: 200
max_iters: 300000
learning_rate: 5e-4
min_lr: 5e-5
weight_decay: 1e-1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: True
warmup_iters: 32000
lr_decay_iters: 300000